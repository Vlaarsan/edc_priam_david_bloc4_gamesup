name: CI/CD - GamesUP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/gamesup-backend
  ML_API_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/gamesup-ml-api

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: gamesup
          MYSQL_USER: gamesup
          MYSQL_PASSWORD: gamesup
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Tests backend + couverture JaCoCo
        run: mvn test -B
        working-directory: ./backend

      - name: Rapport de couverture backend
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/

      - name: Login Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push image backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest

  ml-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r ml-api/requirements.txt

      - name: Run ML API tests
        run: |
          python -c "
          import uvicorn
          import requests
          # Lancer l'API en arrière-plan
          import subprocess, time
          proc = subprocess.Popen(['uvicorn', 'main:app', '--port', '8001'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          time.sleep(3)
          try:
              r = requests.get('http://localhost:8001/health', timeout=5)
              assert r.status_code == 200
          finally:
              proc.terminate()
              proc.wait()

      - name: Login Docker Hub (push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push image ml-api
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./ml-api
          push: true
          tags: ${{ env.ML_API_IMAGE }}:latest
