# ============================================================================
# GamesUP Backend - Application Configuration
# ============================================================================

spring.application.name=gamesup-backend
server.port=8080

# --- Database (H2 for tests, MySQL for production) ---
spring.datasource.url=jdbc:h2:mem:gamesupdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
jwt.secret=dGhpcy2lz2h1ZGRlbmN52s2V2Y2VudGVyZA==

# --- H2 Console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

