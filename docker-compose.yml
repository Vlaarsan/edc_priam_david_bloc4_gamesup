# ============================================================================
# Docker Compose - GamesUP
# ============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: gamesup-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: gamesup
      MYSQL_USER: gamesup
      MYSQL_PASSWORD: gamesup
    ports:
      - "3306:3306"
    volumes:
      - gamesup_mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gamesup-backend
    restart: always
    depends_on:
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_HOST: mysql
      MYSQL_USER: gamesup
      MYSQL_PASSWORD: gamesup
    ports:
      - "8080:8080"

  ml-api:
    build:
      context: ./ml-api
      dockerfile: Dockerfile
    container_name: gamesup-ml-api
    restart: always
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gamesup-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  gamesup_mysql_data:
